services:
  mongo:
    image: mongo:8
    # single-node replica set: needed for transactions/change streams and mirrors production
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017' # for Compass/mongosh; connect with ?directConnection=true
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # initiates the replica set on first run, then reports healthy once a primary exists
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DB: biteexpress
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  mongo-data:
