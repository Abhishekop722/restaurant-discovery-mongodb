# Hot-reload overlay: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  api:
    build:
      target: deps
    command: ['pnpm', 'dev']
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tsconfig.json:/app/tsconfig.json
    user: root
