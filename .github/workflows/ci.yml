name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same branch supersedes the running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Architecture rules and dead code
        run: |
          pnpm deps:check
          pnpm knip
      - name: Dependency audit (production, high severity)
        run: pnpm audit --prod --audit-level=high
      - name: Unit and integration tests with coverage thresholds
        run: pnpm test:coverage
      - run: pnpm build

  # Builds the real image, starts the compose stack (API + MongoDB replica set) and calls it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Smoke test
        run: pnpm test:e2e
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
